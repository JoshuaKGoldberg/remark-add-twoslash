description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        cache: pnpm
        node-version: 24.3.0
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
